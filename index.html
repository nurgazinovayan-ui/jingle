<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jingle — онлайн плеер</title>
  <meta name="description" content="Онлайн музыкальный плеер" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237c5cff' d='M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <span>Jingle</span>
      </div>
      <label class="upload-btn" title="Добавить свои файлы">
        <input id="fileInput" type="file" accept="audio/*" multiple hidden />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>Добавить файлы</span>
      </label>
    </header>

    <main class="layout">
      <!-- Сейчас играет -->
      <section class="now-playing" aria-label="Сейчас играет">
        <div class="cover" id="cover">
          <img id="coverImg" alt="" hidden />
          <div class="cover-fallback" id="coverFallback">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
          <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="meta">
          <h1 id="title">Выберите трек</h1>
          <p id="artist">—</p>
        </div>

        <div class="progress">
          <span id="currentTime" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка" />
          <span id="duration" class="time">0:00</span>
        </div>

        <div class="controls">
          <button id="shuffleBtn" class="icon-btn toggle" title="Перемешать (S)" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <button id="prevBtn" class="icon-btn" title="Предыдущий (←↑ / P)">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="playBtn" class="play-btn" title="Играть / пауза (Пробел)" aria-label="Играть">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <button id="nextBtn" class="icon-btn" title="Следующий (N)">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="repeatBtn" class="icon-btn toggle" title="Повтор (R)" aria-pressed="false" data-mode="off">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <b class="repeat-one">1</b>
          </button>
        </div>

        <div class="volume">
          <button id="muteBtn" class="icon-btn small" title="Без звука (M)">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="i-mute" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость" />
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <!-- Плейлист -->
      <section class="playlist" aria-label="Плейлист">
        <div class="playlist-head">
          <h2>Плейлист <span id="count" class="count"></span></h2>
          <input id="search" type="search" placeholder="Поиск…" aria-label="Поиск по плейлисту" />
        </div>
        <ol id="trackList" class="track-list"></ol>
        <div id="dropHint" class="drop-hint">
          Перетащите сюда аудиофайлы, чтобы послушать их
        </div>
      </section>
    </main>
  </div>

  <div id="dropOverlay" class="drop-overlay" hidden>
    <div>Отпустите, чтобы добавить в плейлист</div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
