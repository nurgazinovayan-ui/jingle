<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jingle — онлайн плеер</title>
  <meta name="description" content="Слушайте музыку онлайн" />
  <meta name="theme-color" content="#0f1115" />
  <meta property="og:title" content="Jingle — онлайн плеер" />
  <meta property="og:description" content="Слушайте музыку онлайн" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237c5cff' d='M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <span>Jingle</span>
      </div>
      <div class="top-actions">
        <button id="shareSiteBtn" class="pill-btn" title="Скопировать ссылку на плеер">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 21 5a3 3 0 1 0-5.91.7L8.04 9.81A2.99 2.99 0 0 0 3 12a3 3 0 0 0 5.04 2.19l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
          <span>Поделиться</span>
        </button>
        <button id="loginBtn" class="pill-btn" title="Вход для загрузки треков">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
          <span>Войти</span>
        </button>
        <button id="logoutBtn" class="pill-btn" hidden title="Выйти из режима администратора">
          <span>Выйти</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <!-- Сейчас играет -->
      <section class="now-playing" aria-label="Сейчас играет">
        <div class="cover">
          <img id="coverImg" alt="" hidden />
          <div class="cover-fallback" id="coverFallback">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
          <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <button id="shareTrackBtn" class="cover-share" title="Ссылка на этот трек" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
          </button>
        </div>

        <div class="meta">
          <h1 id="title">Выберите трек</h1>
          <p id="artist">—</p>
        </div>

        <div class="progress">
          <span id="currentTime" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка" />
          <span id="duration" class="time">0:00</span>
        </div>

        <div class="controls">
          <button id="prevBtn" class="icon-btn" title="Предыдущий (P)" aria-label="Предыдущий">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="playBtn" class="play-btn" title="Играть / пауза (Пробел)" aria-label="Играть / пауза">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <button id="nextBtn" class="icon-btn" title="Следующий (N)" aria-label="Следующий">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div class="modes" role="group" aria-label="Режимы воспроизведения">
          <button id="loopAllBtn" class="mode-btn" aria-pressed="false" title="Зациклить плейлист (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span>Зациклить плейлист</span>
          </button>
          <button id="loopOneBtn" class="mode-btn" aria-pressed="false" title="Повторять один трек (T)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
            <span>Повтор трека</span>
          </button>
          <button id="shuffleBtn" class="mode-btn" aria-pressed="false" title="Перемешать (S)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            <span>Перемешать</span>
          </button>
        </div>

        <div class="volume">
          <button id="muteBtn" class="icon-btn small" title="Без звука (M)" aria-label="Без звука">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="i-mute" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость" />
        </div>
      </section>

      <!-- Плейлист -->
      <section class="playlist" aria-label="Плейлист">
        <div class="playlist-head">
          <h2>Плейлист <span id="count" class="count"></span></h2>
          <input id="search" type="search" placeholder="Поиск…" aria-label="Поиск по плейлисту" />
        </div>

        <!-- Панель загрузки (видна только администратору) -->
        <div id="uploadPanel" class="upload-panel" hidden>
          <label id="dropzone" class="dropzone">
            <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.opus,.aac" multiple hidden />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <span><b>Выберите</b> или перетащите аудиофайлы</span>
            <small>mp3, m4a, ogg, wav, flac · до 200 МБ · имя «Исполнитель - Название» заполнит поля</small>
          </label>
          <ul id="queue" class="queue"></ul>
          <div id="queueActions" class="queue-actions" hidden>
            <button id="clearQueueBtn" class="pill-btn">Очистить</button>
            <button id="uploadBtn" class="pill-btn primary">Загрузить</button>
          </div>
          <p id="setupHint" class="setup-hint" hidden></p>
        </div>

        <ol id="trackList" class="track-list"></ol>
      </section>
    </main>
  </div>

  <!-- Вход -->
  <dialog id="loginDialog" class="dialog">
    <form id="loginForm" method="dialog">
      <h3>Вход для загрузки треков</h3>
      <p class="muted">Пароль задаётся переменной <code>ADMIN_PASSWORD</code> в настройках проекта на Vercel.</p>
      <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password" required />
      <p id="loginError" class="error"></p>
      <div class="dialog-actions">
        <button type="button" id="loginCancel" class="pill-btn">Отмена</button>
        <button type="submit" class="pill-btn primary">Войти</button>
      </div>
    </form>
  </dialog>

  <div id="dropOverlay" class="drop-overlay" hidden>
    <div>Отпустите, чтобы добавить в очередь загрузки</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
